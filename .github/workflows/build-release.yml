name: Build TYFZA1 firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (an existing tag must match the selected commit)
        required: true
      config_file:
        description: Optional repository path to a custom OpenWrt config
        required: false
        default: ''
      # 新增：不填就用 diy-part.sh 里 DIY_CONFIG 指定的那份
      #       （默认 configs/tyfza1-diy.config），想临时关掉自定义就填 0
      diy_enable:
        description: 'Run diy-part.sh (1=yes, 0=skip)'
        required: false
        default: '1'
      # 排查用：0 = 不换 smartdns 源码，用官方 feed 的 46.1 原版
      diy_smartdns:
        description: 'Use your smartdns fork (1=yes, 0=official 46.1)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: firmware-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release source
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            build_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$build_commit" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_commit, not build commit $build_commit. Choose a new tag or build the tagged commit."
              exit 1
            fi
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Obtain locked OpenWrt source
        run: sh port/scripts/prepare.sh sources/openwrt
      - name: Prepare OMCI compiler
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: sources/openwrt/dl
          key: openwrt-downloads-${{ runner.os }}-${{ hashFiles('port/sources.lock.json', 'configs/feeds.conf') }}

      # ==================== 更新 Feeds（只 update，绝不能 install -a）====================
      # 顺序：必须在 DIY 之前。diy-part.sh 要改 feeds/packages/net/smartdns/Makefile，
      # update 之后这个文件就存在了（feeds/packages/ 是 update 拉下来的源码树），
      # 不需要 install —— install 只是在 package/feeds/ 建符号链接。
      #
      # ⚠ 这里原来是 install -a，这正是上次编译失败的根因：
      #   树里此时没有 feeds.conf，scripts/feeds 会回退到 feeds.conf.default，
      #   把 routing / telephony / video 一起装进来。其中 qt5base、weechat、
      #   squeezelite 存在循环 Kconfig 依赖，于是：
      #       error: recursive dependency detected!
      #   make defconfig 直接 abort，make world 压根没跑，所以最后打包时
      #   cp: cannot stat ...-kernel.itb —— 真实错误被埋在前面几十兆日志里。
      #   项目自己的做法（scripts/prepare_luci_feeds.sh）是只装 .config 里列出的包，
      #   那些有问题的包压根不会进 package/feeds，也就不会被 defconfig 扫描到。
      - name: Update Feeds
        run: |
          cd sources/openwrt
          # 用项目锁定的 feeds.conf（只有 packages + luci），
          # 否则会按 feeds.conf.default 把 5 个 feed 全 clone 一遍，白花时间
          cp ../../configs/feeds.conf feeds.conf
          ./scripts/feeds update -a

      # ==================== 执行自定义 DIY 脚本 ====================
      - name: Run Custom DIY Script
        env:
          DIY_ENABLE: ${{ inputs.diy_enable || '1' }}
          DIY_SMARTDNS: ${{ inputs.diy_smartdns || '1' }}
        run: |
          if [ "$DIY_ENABLE" != "1" ]; then
            echo "diy_enable=$DIY_ENABLE，跳过 diy-part.sh"
          elif [ -f "diy-part.sh" ]; then
            chmod +x diy-part.sh
            cd sources/openwrt
            ../../diy-part.sh
          else
            echo "diy-part.sh not found, skipping."
          fi

      - name: Obtain common runtime inputs and signing key
        env:
          FIT_SIGNING_KEY: ${{ secrets.TYFZA1_FIT_SIGNING_KEY }}
        run: |
          mkdir -p artifacts/runtime-inputs artifacts/signing
          gh release download v0.1.0-alpha --repo LeoooChen/PonWRT-TYFZA1 \
            --pattern tyfza1-runtime-inputs-v1.tar.gz --dir artifacts
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          umask 077
          if [ -n "$FIT_SIGNING_KEY" ]; then
            printf '%s\n' "$FIT_SIGNING_KEY" > artifacts/signing/dev.key
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key \
              --output artifacts/signing/dev.key
            echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          fi
          openssl req -new -x509 -key artifacts/signing/dev.key \
            -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650
      - name: Build OpenWrt and native PE
        shell: bash
        env:
          TYFZA1_RUNTIME_INPUTS: ${{ github.workspace }}/artifacts/runtime-inputs
          TYFZA1_SIGNING_KEYS: ${{ github.workspace }}/artifacts/signing
          # 留空：.config 由 diy-part.sh 写好；sync-overlay.sh 见到
          # 非空 .config 就不会再覆盖它。要临时换配置才在这里填路径。
          TYFZA1_CONFIG: ${{ inputs.config_file }}
        run: |
          # 关键：没有 pipefail 时，管道的退出码取最后一个命令 tee 的返回值（恒为 0），
          # make world 失败也会被判成成功，一路走到打包那步才以 "cp: cannot stat
          # ...-kernel.itb" 的形式爆出来，真实错误被埋在前面几十兆日志里。
          set -o pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          sh port/scripts/build.sh sources/openwrt "$(nproc)" 2>&1 | tee artifacts/build.log
      - name: 定位失败包（V=s 复现）
        if: failure()
        run: |
          # OpenWrt 默认 verbosity 会把子 make 的真实报错吞掉，只留一行
          # "ERROR: package/xxx failed to build."。这里把包名抠出来，单编它一次，
          # 用 V=s 把真正的 gcc / make 错误打到日志里。
          #
          # ⚠ build.log 在仓库根，不在 sources/openwrt 下 —— 用绝对路径，
          #   否则就变成 "sed: can't read artifacts/build.log"。
          LOG="$GITHUB_WORKSPACE/artifacts/build.log"
          PKG=$(sed -n 's/^[[:space:]]*ERROR: \(package\/[^ ]*\) failed to build\.$/\1/p' \
                "$LOG" | head -1)
          if [ -z "$PKG" ]; then
            echo "build.log 里没捕获到失败包名，看一眼尾部："
            tail -40 "$LOG" 2>&1 || echo "（$LOG 也不存在）"
            PKG="package/feeds/packages/smartdns"   # 兜底：目前已知唯一失败的包
          fi
          echo "重编失败包: $PKG （V=s -j1，只编这一个）"
          cd "$GITHUB_WORKSPACE/sources/openwrt"
          make "$PKG/compile" V=s -j1 2>&1 | tail -200
      - name: 检查产物（诊断用）
        run: |
          cd sources/openwrt
          echo "===== .config 里的 target / 设备 / 版本符号 ====="
          grep -E "CONFIG_TARGET_|CONFIG_VERSION(FILENAMES|OPT|_NUMBER|CODE)?\b" .config || true
          echo "===== bin/targets/rtl9617c/generic/ ====="
          ls -la bin/targets/rtl9617c/generic/ 2>&1 || echo "（目录不存在）"
          echo "===== bin 下所有 itb / squashfs / sysupgrade ====="
          find bin -maxdepth 6 \( -name "*.itb" -o -name "*.squashfs" -o -name "*sysupgrade*" \) \
            -printf '%p  %s bytes\n' 2>/dev/null | head -30 || echo "（一个都没有）"
          echo "===== defconfig 后设备符号是否还在 ====="
          grep -c "^CONFIG_TARGET_rtl9617c_generic_DEVICE_tianyi_tyfza1=y" .config ||
            echo "设备符号已丢失 —— 这就是没有 kernel.itb 的原因"
      - name: Package sysupgrade and factory telnet installer
        run: |
          sh scripts/package_release.sh sources/openwrt artifacts/release
          git archive --format=tar.gz --prefix=PonWRT-TYFZA1/ HEAD \
            > artifacts/release/PonWRT-TYFZA1-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: firmware-and-build-log
          path: |
            artifacts/release/
            artifacts/build.log
          retention-days: 14
      - name: Publish release
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" --prerelease --draft \
              --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/sysupgrade.bin \
            artifacts/release/tyfza1-telnet-install.tar.gz artifacts/release/SHA256SUMS \
            artifacts/release/COPYING artifacts/release/PonWRT-TYFZA1-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
