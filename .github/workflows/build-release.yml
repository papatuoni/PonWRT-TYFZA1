# ==========================================================================
# DIY 版 —— 在上游 v0.8.0 基础上加了自定义编译步骤，共 17 步（上游原版 13 步）
#
# 一眼确认是否拿对文件：本文件应包含以下 5 个上游没有的内容
#   1. inputs 里有 diy_enable / diy_smartdns / diy_ddns
#   2. 步骤 9  Update Feeds
#   3. 步骤 10 Run Custom DIY Script
#   4. 步骤 13 定位失败点（V=s 复现）  ← if: failure()
#   5. 步骤 14 对齐镜像命名
# 若这 5 项都在，说明是 DIY 版；若只有 13 步，那是上游原版。
# ==========================================================================
name: Build TYFZA1 firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (an existing tag must match the selected commit)
        required: true
      config_file:
        description: Optional repository path to a custom OpenWrt config
        required: false
        default: ''
      # ↓↓↓ 以下三个为自定义编译开关 ↓↓↓
      diy_enable:
        description: 'Run diy-part.sh (1=yes, 0=skip)'
        required: false
        default: '1'
      diy_smartdns:
        description: 'Use your smartdns fork (1=yes, 0=official 46.1)'
        required: false
        default: '1'
      diy_ddns:
        description: 'Add ddns-go + luci-app-ddns-go from ImmortalWrt (1=yes, 0=no)'
        required: false
        default: '1'
      diy_smartdns_ui:
        description: 'smartdns Web dashboard (Rust plugin, slow, 1=yes)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: firmware-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release source
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with v (for example, v0.8.0-beta)."; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            build_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$build_commit" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_commit, not build commit $build_commit. Choose a new tag or build the tagged commit."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Use a new tag to preserve the published firmware."
            exit 1
          fi
      - name: Prepare release notes
        env:
          DIY_DDNS: ${{ inputs.diy_ddns || '1' }}
          DIY_SMARTDNS: ${{ inputs.diy_smartdns || '1' }}
          DIY_SMARTDNS_UI: ${{ inputs.diy_smartdns_ui || '0' }}
        run: |
          python3 scripts/test_release_notes.py
          # 上游的 scripts/release_notes.py 要求 RELEASE_NOTES.md 里必须存在
          # 一个 "## <tag>" 小节且内容非空，否则 exit 2：
          #   error: Expected exactly one changelog section for v0.8.0-diy1; found 0
          # 自建固件的 tag（如 v0.8.0-diy1）上游 RELEASE_NOTES.md 里没有对应小节，
          # 于是整个 job 在这一步（编译开始前）就挂掉。这里兜底自动生成，
          # 以后换任何 tag 都不用再去改 RELEASE_NOTES.md。
          if ! python3 scripts/release_notes.py "$RELEASE_TAG" \
                > "$RUNNER_TEMP/release-notes.md" 2>/tmp/rn.err; then
            echo "::warning::RELEASE_NOTES.md 里没有 $RELEASE_TAG 的小节，改用自动生成的说明"
            cat /tmp/rn.err
            {
              echo "## $RELEASE_TAG"
              echo
              echo "自建固件（DIY build），基于 PonWRT-TYFZA1 官方源码编译。"
              echo
              echo "### 本版包含"
              echo
              echo "- 默认 LAN IP：192.168.2.1"
              [ "$DIY_SMARTDNS" = 1 ] && echo "- smartdns：papatuoni/smartdns @ custom-48.4"
              echo "- OpenClash：vernesong/OpenClash"
              echo "- TurboACC：BBR + flow offload + fullcone（不带 SFE）"
              [ "$DIY_DDNS" = 1 ] && echo "- 动态 DNS：ddns-go + luci-app-ddns-go（ImmortalWrt）"
              [ "$DIY_SMARTDNS_UI" = 1 ] && echo "- smartdns Web 仪表盘 smartdns-ui（:6080，admin/password）"
              echo
              echo "刷机方法与已知问题见仓库 README；上游变更见 RELEASE_NOTES.md。"
            } > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "===== 本次 Release 说明 ====="
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Verify storage migration
        run: python3 scripts/test_ubi_storage.py
      - name: Obtain locked OpenWrt source
        run: sh port/scripts/prepare.sh sources/openwrt
      - name: Prepare OMCI compiler
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: sources/openwrt/dl
          key: openwrt-downloads-${{ runner.os }}-${{ hashFiles('port/sources.lock.json', 'configs/feeds.conf') }}

      # ==================== 新增：更新 Feeds（必须在 DIY 之前）====================
      # diy-part.sh 要改 feeds/packages/net/smartdns/Makefile 换掉 smartdns 源码，
      # 也要 feeds install ddns-scripts / luci-app-ddns，feeds 没 update 就找不到。
      #
      # ⚠ 只能用项目锁定的 feeds.conf（packages + luci），且只 update 不 install -a：
      #   树里此时还没有 feeds.conf，scripts/feeds 会回退到 feeds.conf.default，
      #   把 routing / telephony / video 一起装进来，其中 qt5base、weechat、
      #   squeezelite 有循环 Kconfig 依赖，会让 make defconfig 直接 abort。
      - name: Update Feeds
        run: |
          cd sources/openwrt
          cp ../../configs/feeds.conf feeds.conf
          ./scripts/feeds update -a

      # ==================== 新增：执行自定义 DIY 脚本 ====================
      - name: Run Custom DIY Script
        env:
          DIY_ENABLE: ${{ inputs.diy_enable || '1' }}
          DIY_SMARTDNS: ${{ inputs.diy_smartdns || '1' }}
          DIY_DDNS: ${{ inputs.diy_ddns || '1' }}
          DIY_SMARTDNS_UI: ${{ inputs.diy_smartdns_ui || '0' }}
        run: |
          if [ "$DIY_ENABLE" != "1" ]; then
            echo "diy_enable=$DIY_ENABLE，跳过 diy-part.sh"
          elif [ -f "diy-part.sh" ]; then
            chmod +x diy-part.sh
            cd sources/openwrt
            ../../diy-part.sh
          else
            echo "::warning::diy-part.sh not found, skipping."
          fi

      - name: Obtain common runtime inputs and signing key
        env:
          FIT_SIGNING_KEY: ${{ secrets.TYFZA1_FIT_SIGNING_KEY }}
        run: |
          mkdir -p artifacts/runtime-inputs artifacts/signing
          gh release download v0.1.0-alpha --repo LeoooChen/PonWRT-TYFZA1 \
            --pattern tyfza1-runtime-inputs-v1.tar.gz --dir artifacts
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          umask 077
          if [ -n "$FIT_SIGNING_KEY" ]; then
            printf '%s\n' "$FIT_SIGNING_KEY" > artifacts/signing/dev.key
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key \
              --output artifacts/signing/dev.key
            echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          fi
          openssl req -new -x509 -key artifacts/signing/dev.key \
            -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650
      - name: Build OpenWrt and native PE
        shell: bash
        env:
          TYFZA1_RUNTIME_INPUTS: ${{ github.workspace }}/artifacts/runtime-inputs
          TYFZA1_SIGNING_KEYS: ${{ github.workspace }}/artifacts/signing
          TYFZA1_CONFIG: ${{ inputs.config_file }}
        run: |
          # 关键：没有 pipefail 时，管道退出码取最后一个命令 tee 的（恒为 0），
          # make world 失败也会被判成成功，一路走到打包才以 "cp: cannot stat
          # ...-kernel.itb" 的形式爆出来，真实错误被埋在前面几十兆日志里。
          set -o pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          sh port/scripts/build.sh sources/openwrt "$(nproc)" 2>&1 | tee artifacts/build.log

      # ==================== 新增：失败时自动 V=s 复现真实报错 ====================
      - name: 定位失败点（V=s 复现）
        if: failure()
        run: |
          # build.log 在仓库根，不在 sources/openwrt 下 —— 必须用绝对路径。
          LOG="$GITHUB_WORKSPACE/artifacts/build.log"

          echo "===== runner 磁盘剩余（内核编挂最常见原因是 ENOSPC）====="
          df -h "$GITHUB_WORKSPACE" 2>/dev/null || df -h
          echo "===== build_dir / staging_dir / dl 占用 ====="
          du -sh sources/openwrt/build_dir sources/openwrt/staging_dir \
                sources/openwrt/dl 2>/dev/null

          # 失败的可能是包，也可能是 target/linux（内核）或 toolchain。
          # 旧版只匹配 package/...，遇到 "ERROR: target/linux failed to build."
          # 就抓不到，只会打印一句"没捕获到失败包名"。
          TARGET=$(sed -n 's/^[[:space:]]*ERROR: \([^ ]*\) failed to build\.$/\1/p' \
                   "$LOG" | tail -1)
          if [ -z "$TARGET" ]; then
            echo "build.log 里没捕获到失败目标，看一眼尾部："
            tail -60 "$LOG" 2>&1 || echo "（$LOG 也不存在）"
            exit 0
          fi
          echo "重编失败目标: $TARGET （V=s -j1，只编这一个）"
          cd "$GITHUB_WORKSPACE/sources/openwrt"
          make "$TARGET/compile" V=s -j1 2>&1 | tail -250

      # ==================== 新增：对齐镜像命名 ====================
      # scripts/package_release.sh 把镜像名写死成 openwrt--rtl9617c-generic-...，
      # 而 IMG_PREFIX 会随 CONFIG_VERSION_FILENAMES / VERSION_CODE_FILENAMES 变化，
      # 名字对不上就会 cp: cannot stat ...-kernel.itb。这里按实际文件名建硬链接兜底。
      - name: 对齐镜像命名
        run: |
          cd sources/openwrt/bin/targets/rtl9617c/generic || exit 0
          n=0
          for f in openwrt-*-rtl9617c-generic-tianyi_tyfza1-*; do
            [ -e "$f" ] && [ ! -L "$f" ] || continue
            rest="${f##*rtl9617c-generic-tianyi_tyfza1-}"
            tgt="openwrt--rtl9617c-generic-tianyi_tyfza1-${rest}"
            [ -e "$tgt" ] || { ln -f "$f" "$tgt"; n=$((n+1)); }
          done
          echo "已补建 $n 个对齐链接"
          ls -la openwrt--rtl9617c-generic-tianyi_tyfza1-* 2>/dev/null || echo "（无）"

      - name: Package firmware and installer
        run: |
          sh scripts/package_release.sh sources/openwrt artifacts/release
          git archive --format=tar.gz --prefix=PonWRT-TYFZA1/ HEAD \
            > artifacts/release/PonWRT-TYFZA1-source.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: firmware-and-build-log
          path: |
            artifacts/release/
            artifacts/build.log
          retention-days: 14
      - name: Publish release
        run: |
          set -x
          echo "RELEASE_TAG=$RELEASE_TAG  REPO=$GITHUB_REPOSITORY"
          ls -la artifacts/release/ || { echo "打包产物目录不存在，前面某步失败了"; exit 1; }
          # 保险：万一上面生成 release-notes 那步没跑（比如 tag 触发且 step 被改过），
          # 这里再兜一次，避免 gh release create 因缺文件而退出。
          [ -s "$RUNNER_TEMP/release-notes.md" ] || \
            printf '# %s\n\nTYFZA1 firmware build.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" --draft \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/sysupgrade.bin \
            artifacts/release/tyfza1-telnet-install.tar.gz artifacts/release/SHA256SUMS \
            artifacts/release/COPYING artifacts/release/PonWRT-TYFZA1-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          echo "===== 发布完成，核对用 ====="
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url --jq \
            '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)\nURL: \(.url)"'
