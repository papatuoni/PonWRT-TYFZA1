# ==========================================================================
# DIY 版 —— 基于上游 v0.8.2-beta 骨架，加回自定义编译步骤，共 21 步（上游 15 步）
#
# 一眼确认是否拿对文件：本文件应包含以下 6 项上游没有的内容
#   1. inputs 里有 diy_enable / diy_smartdns / diy_ddns / diy_smartdns_ui / diy_wireless
#   2. 步骤 Update Feeds
#   3. 步骤 Run Custom DIY Script
#   4. 步骤 定位失败点（V=s 复现）  ← if: failure()
#   5. 步骤 对齐镜像命名
#   6. Prepare release notes 里有自建 tag 的兜底生成
# 若这 6 项都在，说明是 DIY 版；若只有 15 步且没有 diy_* 输入，那是上游原版。
# ==========================================================================
name: Build TYFZA1 firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (an existing tag must match the selected commit)
        required: true
      config_file:
        description: Optional repository path to a custom OpenWrt config
        required: false
        default: ''
      replace_release:
        description: Rebuild and replace assets of an existing release
        type: boolean
        required: false
        default: false
      # ↓↓↓ 以下为自定义编译开关 ↓↓↓
      diy_enable:
        description: 'Run diy-part.sh (1=yes, 0=skip)'
        required: false
        default: '1'
      diy_smartdns:
        description: 'Use your smartdns fork (1=yes, 0=official)'
        required: false
        default: '1'
      diy_ddns:
        description: 'Add ddns-scripts + luci-app-ddns (1=yes, 0=no)'
        required: false
        default: '1'
      diy_smartdns_ui:
        description: 'smartdns Web dashboard (Rust plugin, slow): 0=skip build, m=build apk only, 1=build+into firmware'
        required: false
        default: '0'
      diy_wireless:
        description: 'Keep Wi-Fi stack (1=yes, 0=strip, CANNOT be reinstalled later)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: firmware-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      REPLACE_RELEASE: ${{ inputs.replace_release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release source
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "::error::Release tag must start with v (for example, v0.8.2-beta)."; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            build_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$build_commit" ]; then
              echo "::error::Release tag $RELEASE_TAG points to $tag_commit, not build commit $build_commit. Choose a new tag or build the tagged commit."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$REPLACE_RELEASE" != true ]; then
            echo "::error::Release $RELEASE_TAG already exists. Enable replace_release to rebuild this release, or choose a new tag."
            exit 1
          fi
      - name: Prepare release notes
        env:
          DIY_DDNS: ${{ inputs.diy_ddns || '1' }}
          DIY_SMARTDNS: ${{ inputs.diy_smartdns || '1' }}
          DIY_SMARTDNS_UI: ${{ inputs.diy_smartdns_ui || '0' }}
          DIY_WIRELESS: ${{ inputs.diy_wireless || '1' }}
        run: |
          python3 scripts/test_release_notes.py
          # 上游的 scripts/release_notes.py 要求 RELEASE_NOTES.md 里必须存在
          # 一个 "## <tag>" 小节且内容非空，否则 exit 2：
          #   error: Expected exactly one changelog section for v0.8.2-diy1; found 0
          # 自建固件的 tag（如 v0.8.2-diy1）上游 RELEASE_NOTES.md 里没有对应小节，
          # 于是整个 job 在这一步（编译开始前）就挂掉。这里兜底自动生成，
          # 以后换任何 tag 都不用再去改 RELEASE_NOTES.md。
          if ! python3 scripts/release_notes.py "$RELEASE_TAG" \
                > "$RUNNER_TEMP/release-notes.md" 2>/tmp/rn.err; then
            echo "::warning::RELEASE_NOTES.md 里没有 $RELEASE_TAG 的小节，改用自动生成的说明"
            cat /tmp/rn.err
            {
              echo "## $RELEASE_TAG"
              echo
              echo "自建固件（DIY build），基于 PonWRT-TYFZA1 官方源码编译。"
              echo
              echo "### 本版包含"
              echo
              echo "- 默认 LAN IP：192.168.2.1"
              [ "$DIY_SMARTDNS" = 1 ] && echo "- smartdns：papatuoni/smartdns @ custom-48.4"
              echo "- OpenClash：vernesong/OpenClash"
              echo "- TurboACC：BBR + flow offload + fullcone（不带 SFE）"
              [ "$DIY_DDNS" = 1 ] && echo "- 动态 DNS：ddns-scripts + luci-app-ddns（Cloudflare 扩展）"
              [ "$DIY_SMARTDNS_UI" = 1 ] && echo "- smartdns Web 仪表盘 smartdns-ui（:6080，admin/password）"
              if [ "$DIY_WIRELESS" != 1 ]; then
                echo "- 已关闭无线（kmod-rtl-ax-ap / wpad / wifi-scripts 均未编入，且无法事后装回）"
              else
                echo "- 已开启无线（默认保留 kmod-rtl-ax-ap / wpad-mbedtls / wifi-scripts）"
              fi
              echo
              echo "刷机方法与已知问题见仓库 README；上游变更见 RELEASE_NOTES.md。"
            } > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "===== 本次 Release 说明 ====="
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Verify LAN initialization and port counters
        run: |
          python3 scripts/test_lan_probe_isolation.py
          python3 scripts/test_lan_async.py
          python3 scripts/test_qspi_poll.py
          python3 scripts/test_lan_pm_mapping.py
          python3 scripts/test_lan_link_mode.py
      - name: Verify storage migration
        run: |
          python3 scripts/test_ubi_storage.py
          python3 scripts/test_storage_boards.py
      - name: Obtain locked OpenWrt source
        run: sh port/scripts/prepare.sh sources/openwrt
      - name: Verify sysupgrade board identities
        run: python3 scripts/test_sysupgrade_board.py
      - name: Prepare OMCI compiler
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: sources/openwrt/dl
          key: openwrt-downloads-${{ runner.os }}-${{ hashFiles('port/sources.lock.json', 'configs/feeds.conf') }}

      # ==================== 新增：更新 Feeds（必须在 DIY 之前）====================
      # diy-part.sh 要改 feeds/packages/net/smartdns/Makefile 换掉 smartdns 源码，
      # 也要 feeds install ddns-scripts / luci-app-ddns，feeds 没 update 就找不到。
      #
      # ⚠ 只能用项目锁定的 feeds.conf（packages + luci），且只 update 不 install -a：
      #   树里此时还没有 feeds.conf，scripts/feeds 会回退到 feeds.conf.default，
      #   把 routing / telephony / video 一起装进来，其中 qt5base、weechat、
      #   squeezelite 有循环 Kconfig 依赖，会让 make defconfig 直接 abort。
      - name: Update Feeds
        run: |
          cd sources/openwrt
          cp ../../configs/feeds.conf feeds.conf
          ./scripts/feeds update -a

      # ==================== 新增：执行自定义 DIY 脚本 ====================
      - name: Run Custom DIY Script
        env:
          DIY_ENABLE: ${{ inputs.diy_enable || '1' }}
          DIY_SMARTDNS: ${{ inputs.diy_smartdns || '1' }}
          DIY_DDNS: ${{ inputs.diy_ddns || '1' }}
          DIY_SMARTDNS_UI: ${{ inputs.diy_smartdns_ui || '0' }}
          DIY_WIRELESS: ${{ inputs.diy_wireless || '1' }}
        run: |
          if [ "$DIY_ENABLE" != "1" ]; then
            echo "diy_enable=$DIY_ENABLE，跳过 diy-part.sh"
          elif [ -f "diy-part.sh" ]; then
            chmod +x diy-part.sh
            cd sources/openwrt
            ../../diy-part.sh
          else
            echo "::warning::diy-part.sh not found, skipping."
          fi

      - name: Obtain common runtime inputs and signing key
        env:
          FIT_SIGNING_KEY: ${{ secrets.TYFZA1_FIT_SIGNING_KEY }}
        run: |
          mkdir -p artifacts/runtime-inputs artifacts/signing
          gh release download v0.1.0-alpha --repo LeoooChen/PonWRT-TYFZA1 \
            --pattern tyfza1-runtime-inputs-v1.tar.gz --dir artifacts
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          umask 077
          if [ -n "$FIT_SIGNING_KEY" ]; then
            printf '%s\n' "$FIT_SIGNING_KEY" > artifacts/signing/dev.key
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key \
              --output artifacts/signing/dev.key
            echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          fi
          openssl req -new -x509 -key artifacts/signing/dev.key \
            -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650
      - name: Build OpenWrt and native PE
        shell: bash
        env:
          TYFZA1_RUNTIME_INPUTS: ${{ github.workspace }}/artifacts/runtime-inputs
          TYFZA1_SIGNING_KEYS: ${{ github.workspace }}/artifacts/signing
          TYFZA1_CONFIG: ${{ inputs.config_file }}
        run: |
          # 关键：没有 pipefail 时，管道退出码取最后一个命令 tee 的（恒为 0），
          # make world 失败也会被判成成功，一路走到打包才以 "cp: cannot stat
          # ...-kernel.itb" 的形式爆出来，真实错误被埋在前面几十兆日志里。
          set -o pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          sh port/scripts/build.sh sources/openwrt "$(nproc)" 2>&1 | tee artifacts/build.log

      # ===== 新增：编译后自检（防止 "make defconfig 静默丢行" 刷完才发现）=====
      # 本项目反复踩过：.config 里写了 =y，但包在源码树里不存在 / 依赖不满足时，
      # make defconfig 会【静默删掉这一行、不报错】，编译照常成功、产物照常出，
      # 只有刷完机才发现功能没了（smartdns-ui、无线驱动都栽在这）。
      - name: 校验关键包确实编入
        env:
          DIY_SMARTDNS_UI: ${{ inputs.diy_smartdns_ui || '0' }}
          DIY_WIRELESS: ${{ inputs.diy_wireless || '1' }}
        run: |
          CFG="$GITHUB_WORKSPACE/sources/openwrt/.config"
          echo "===== 关键符号在 defconfig 之后是否还在 ====="
          check() {
            sym=$1; want=$2
            if grep -q "^CONFIG_PACKAGE_${sym}=y" "$CFG"; then got=y
            elif grep -q "^CONFIG_PACKAGE_${sym}=m" "$CFG"; then got=m
            else got=n; fi
            if [ "$got" = "$want" ]; then
              echo "  OK   $sym = $got"
            else
              echo "  MISS $sym 期望=$want 实际=$got  <- make defconfig 把它丢了"
            fi
          }
          [ -f "$CFG" ] || { echo "::warning::$CFG 不存在，跳过校验"; exit 0; }
          check smartdns y
          check luci-app-smartdns y
          check smartdns-ui "$DIY_SMARTDNS_UI"
          if [ "$DIY_WIRELESS" = 1 ]; then
            check kmod-rtl-ax-ap y
            check wpad-mbedtls y
            echo "===== 无线驱动是否真的产出（终极证据）====="
            # 上游实证：驱动是内核树内驱动，编译开关是【内核符号 CONFIG_RTL_AX_AP】
            #   port/overlay/.../files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/Makefile
            #     obj-$(CONFIG_RTL_AX_AP) += rtl_ax_ap.o
            # =y 时编进内核（built-in，根本没有 .ko，find 找不到属正常）
            # =m 时才产出 rtl_ax_ap.ko
            # 所以只看 .ko 会误判，必须先看内核符号，再看编译产物。
            LINUX_DIR=$(find "$GITHUB_WORKSPACE/sources/openwrt/build_dir" \
                         -maxdepth 4 -type d -name 'linux-6.18*' 2>/dev/null | head -1)
            SYM=""
            for f in "$LINUX_DIR/.config" \
                     "$GITHUB_WORKSPACE/sources/openwrt/target/linux/rtl9617c/config-6.18"; do
              [ -f "$f" ] && SYM=$(grep -E '^CONFIG_RTL_AX_AP=' "$f" 2>/dev/null | head -1) \
                          && [ -n "$SYM" ] && break
            done
            echo "  CONFIG_RTL_AX_AP = ${SYM:-（未找到）}"
            case "$SYM" in
              CONFIG_RTL_AX_AP=y)
                echo "  OK   驱动编进内核（built-in）—— 设备上没有 .ko 是正常的，" \
                     "用 sh /tmp/check-dualwan.sh 看 /sys/class/ieee80211 判定"
                ;;
              CONFIG_RTL_AX_AP=m)
                echo "  OK   驱动为模块形式，继续找 rtl_ax_ap.ko"
                ;;
              *)
                echo "  MISS CONFIG_RTL_AX_AP 不是 y/m —— 驱动没编，刷完机不会有 Wi-Fi"
                echo "       根因通常是 port/overlay 没进构建流程：驱动源码和"
                echo "       KernelPackage/rtl-ax-ap 都在 overlay 里，官方 feeds 没有这个包，"
                echo "       overlay 缺失时写 CONFIG_PACKAGE_kmod-rtl-ax-ap=y 会被静默丢弃。"
                ;;
            esac
            KO=$(find "$GITHUB_WORKSPACE/sources/openwrt" -name 'rtl_ax_ap.ko' 2>/dev/null | head -1)
            OBJ=$(find "$GITHUB_WORKSPACE/sources/openwrt" -path '*rtl_ax_ap*' \
                    -name 'rtl_ax_ap.o' 2>/dev/null | head -1)
            if [ -n "$KO" ]; then
              echo "  OK   模块: $KO"
            elif [ -n "$OBJ" ]; then
              echo "  OK   目标文件: $OBJ（built-in，无 .ko）"
            else
              echo "  MISS rtl_ax_ap 既无 .ko 也无 .o —— 驱动源码根本没参与编译"
            fi
            APK=$(find "$GITHUB_WORKSPACE/sources/openwrt/bin" \
                    -name 'kmod-rtl-ax-ap*.apk' -o -name 'kmod-rtl-ax-ap*.ipk' 2>/dev/null | head -1)
            [ -n "$APK" ] && echo "  OK   包产物: $(basename "$APK")" \
                          || echo "  MISS 没找到 kmod-rtl-ax-ap 的 apk/ipk"
          fi
          echo "===== 产物 apk/ipk 是否真的生成 ====="
          find "$GITHUB_WORKSPACE/sources/openwrt/bin" \
               \( -name "smartdns*.apk" -o -name "smartdns*.ipk" \) 2>/dev/null \
            | sed 's|.*/|  |'
          echo "（若 smartdns-ui 期望 y 却 MISS，或产物里没有 smartdns-ui，
                多半是 node/host / rust-bindgen/host 没装上，见 diy-part.sh 第 3 段）"

      # ==================== 新增：失败时自动 V=s 复现真实报错 ====================
      - name: 定位失败点（V=s 复现）
        if: failure()
        run: |
          # build.log 在仓库根，不在 sources/openwrt 下 —— 必须用绝对路径。
          LOG="$GITHUB_WORKSPACE/artifacts/build.log"

          echo "===== runner 磁盘剩余（内核编挂最常见原因是 ENOSPC）====="
          df -h "$GITHUB_WORKSPACE" 2>/dev/null || df -h
          echo "===== build_dir / staging_dir / dl 占用 ====="
          du -sh sources/openwrt/build_dir sources/openwrt/staging_dir \
                sources/openwrt/dl 2>/dev/null

          # 失败的可能是包，也可能是 target/linux（内核）或 toolchain。
          # 旧版只匹配 package/...，遇到 "ERROR: target/linux failed to build."
          # 就抓不到，只会打印一句"没捕获到失败包名"。
          TARGET=$(sed -n 's/^[[:space:]]*ERROR: \([^ ]*\) failed to build\.$/\1/p' \
                   "$LOG" | tail -1)
          if [ -z "$TARGET" ]; then
            echo "build.log 里没捕获到失败目标，看一眼尾部："
            tail -60 "$LOG" 2>&1 || echo "（$LOG 也不存在）"
            exit 0
          fi
          echo "重编失败目标: $TARGET （V=s -j1，只编这一个）"
          cd "$GITHUB_WORKSPACE/sources/openwrt"
          make "$TARGET/compile" V=s -j1 2>&1 | tail -250

      # ==================== 新增：对齐镜像命名 ====================
      # scripts/package_release.sh 把镜像名写死成 openwrt--rtl9617c-generic-...，
      # 而 IMG_PREFIX 会随 CONFIG_VERSION_FILENAMES / VERSION_CODE_FILENAMES 变化，
      # 名字对不上就会 cp: cannot stat ...-kernel.itb。这里按实际文件名建硬链接兜底。
      - name: 对齐镜像命名
        run: |
          cd sources/openwrt/bin/targets/rtl9617c/generic || exit 0
          n=0
          for f in openwrt-*-rtl9617c-generic-tianyi_tyfza1-*; do
            [ -e "$f" ] && [ ! -L "$f" ] || continue
            rest="${f##*rtl9617c-generic-tianyi_tyfza1-}"
            tgt="openwrt--rtl9617c-generic-tianyi_tyfza1-${rest}"
            [ -e "$tgt" ] || { ln -f "$f" "$tgt"; n=$((n+1)); }
          done
          echo "已补建 $n 个对齐链接"
          ls -la openwrt--rtl9617c-generic-tianyi_tyfza1-* 2>/dev/null || echo "（无）"

      - name: Verify built board variants
        run: |
          kernel=$(python3 port/tools/project_paths.py --kernel-directory sources/openwrt)
          python3 scripts/test_board_variants.py --kernel "$kernel"

      # ============ 新增：smartdns 产物是否真的带补丁（不再靠刷机才发现）============
      # 之前的问题：源码分支上 route_mgr 是死代码（没有调用点），编译静默成功，
      # 刷完机 strings | grep dualwan 为空才发现白编一场，代价是一次编译 + 一次刷机。
      # 这里在编译阶段就直接查，缺了立刻报出来。
      - name: Verify smartdns dual-wan patch in build output
        run: |
          echo "===== smartdns 产物带不带 dualwan ====="
          sd_bin=$(find sources/openwrt/build_dir -name smartdns -type f -perm -u+x 2>/dev/null | head -1)
          if [ -z "$sd_bin" ]; then
            echo "::warning::没找到 smartdns 二进制，跳过校验"
            exit 0
          fi
          echo "二进制: $sd_bin"
          ls -la "$sd_bin"
          if strings "$sd_bin" 2>/dev/null | grep -qi dualwan; then
            echo "  OK   smartdns 含 dualwan —— route_mgr 已进产物"
            strings "$sd_bin" | grep -i dualwan | head -3 | sed 's/^/       /'
          else
            echo "  MISS smartdns 不含 dualwan"
            echo ""
            echo "  可能原因（按概率）："
            echo "    1. smartdns 分支没应用接线补丁（route_mgr.c 存在但没有调用点）"
            echo "    2. diy-part.sh 拿到的还是旧源码（看上一步打印的 SHA）"
            echo "::error::smartdns 产物不含 dualwan，刷机后双 WAN 不会生效"
            exit 1
          fi
      - name: Package firmware and installer
        run: |
          sh scripts/package_release.sh sources/openwrt artifacts/release
          git archive --format=tar.gz --prefix=PonWRT-TYFZA1/ HEAD \
            > artifacts/release/PonWRT-TYFZA1-source.tar.gz
          # smartdns-ui 设为 m 时，apk 在 bin/packages/ 下、不打进镜像。
          # 拷到这里 → 进 build artifact（14 天），并在 Publish release 时单独上传长期保存。
          mkdir -p artifacts/release/packages
          find sources/openwrt/bin/packages \
               \( -name 'smartdns-ui*.apk' -o -name 'smartdns-ui*.ipk' \) \
               -exec cp -v {} artifacts/release/packages/ \; 2>/dev/null || true
          if [ -z "$(ls -A artifacts/release/packages 2>/dev/null)" ]; then
            echo "没有 smartdns-ui 包产物（diy_smartdns_ui 不是 m/1，或没编出来）"
          else
            echo "===== smartdns-ui 包产物（可下载后 apk add 安装）====="
            ls -la artifacts/release/packages/
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: firmware-and-build-log
          path: |
            artifacts/release/
            artifacts/build.log
          retention-days: 14
      - name: Publish release
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "$RELEASE_TAG" --draft \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/sysupgrade.bin \
            artifacts/release/tyfza1-telnet-install.tar.gz artifacts/release/SHA256SUMS \
            artifacts/release/COPYING artifacts/release/PonWRT-TYFZA1-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
          # smartdns-ui 的 apk（=m 时产出）单独上传，方便之后刷机直接 apk add 复用，
          # 不用为了装个仪表盘再花 30~60 分钟重编一遍。
          for pkg in artifacts/release/packages/smartdns-ui*.apk \
                     artifacts/release/packages/smartdns-ui*.ipk; do
            [ -e "$pkg" ] || continue
            gh release upload "$RELEASE_TAG" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "===== 发布完成，核对用 ====="
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url \
            --jq '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)\nURL: \(.url)"'
